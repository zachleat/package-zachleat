name: Publish Release to npm
on:
  release:
    types: [published]
permissions: read-all
jobs:
  release:
    # see https://github.com/zachleat/package-zachleat/settings/environments
    environment: GitHub Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
        with:
          node-version: "24"
          registry-url: 'https://registry.npmjs.org'
          # Explicit opt out of cache (tanstack cache poison vuln)
          package-manager-cache: false
      - run: npm install -g npm@latest
      - if: ${{ github.event.release.tag_name != '' }}
        run: npm stage publish --provenance