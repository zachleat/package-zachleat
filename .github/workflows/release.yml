name: Publish Release to npm
on:
  release:
    types: [published]
permissions: read-all
jobs:
  release:
    # see https://github.com/zachleat/package-zachleat/settings/environments
    environment: GitHub Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
        with:
          node-version: "24"
          registry-url: 'https://registry.npmjs.org'
          # Explicit opt out of cache (tanstack cache poison vuln)
          package-manager-cache: false
      - run: npm install -g npm@latest
      - if: ${{ github.event.release.tag_name != '' }}
        run: npm stage publish --provenance